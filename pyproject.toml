[project]
name = "sistema-contribuyentes-backend"
version = "0.1.0"
description = "MVP Backend FastAPI para registro contribuyentes (ingreso/salida)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]==0.115.0",
    "sqlmodel==0.0.22",
    "alembic==1.15.1",
    "asyncpg==0.30.0",
    "asyncmy",
    "pydantic-settings==2.5.2",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "passlib[bcrypt]==1.7.4",
]

[project.optional-dependencies]
dev = [
    "ruff==0.7.0",
    "black==24.8.0",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "pytest-cov==5.0.0",
    "pre-commit==3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"
extend-select = ["B", "C4", "E", "F", "I", "UP"]  # Best practices
ignore = ["E501"]  # Line length (black maneja)

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/*" = ["E501"]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
